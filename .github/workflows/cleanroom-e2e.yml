# SPDX-License-Identifier: Apache-2.0
# Periodic live-assembled altitude (audit TEST-008).
#
# The cleanroom e2e exercises a real skill end-to-end via `claude -p
# --plugin-dir` against Haiku — the one rung the unit suite can't fake. It
# costs ~$0.05/run, so it runs on a weekly schedule, on release tags, and on
# demand rather than every PR. It uses whatever auth the runner's `claude` CLI
# already has (a subscription login or an API key — either works); the test
# self-skips when `claude` is not on PATH, so forks and bare environments are
# unaffected.
name: cleanroom-e2e

# Quoted so static YAML tooling (yaml.safe_load) keeps this as the string key
# "on" rather than coercing it to the boolean True (audit-tail UX/QA nit).
"on":
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  cleanroom:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (pinned)
        run: pip install -r requirements.txt

      - name: Run cleanroom e2e (skips if claude CLI is unavailable)
        run: python -m pytest tests/ -q --tb=short -m cleanroom_e2e
