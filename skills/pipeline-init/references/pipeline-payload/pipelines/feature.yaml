# SPDX-License-Identifier: Apache-2.0
# Feature pipeline — full sequence for new functionality.
#
# Each stage runs in a fresh Claude Code session given:
#   - the role file at .pipelines/roles/<role>.md
#   - the manifest at .agent-runs/<run-id>/manifest.yaml
#   - all prior artifacts in .agent-runs/<run-id>/
# and produces a single named artifact.
#
# Gates marked human_approval require the human director to sign off
# before the pipeline advances. Pipeline gates (e.g., policy) are
# automated.
#
# v3.0.0 (WS-1) — optional per-stage execution hints:
#   model:  model id to spawn this stage's subagent with (default: the
#           orchestrator's default model). Left unset everywhere here so
#           no model id is hardcoded; the migration is behavioral.
#   effort: high | extra | max — reasoning effort for the subagent.
#           Bias quality-critical stages (critic, verifier, drift-detector,
#           manager, and the manifest-drafter) to `max`.
#   speed:  fast — fast mode for latency-sensitive stages.
# These keys are advisory and additive: the orchestrator applies them only
# when it spawns a model subagent for the stage (the agent-role stages).
# `role: pipeline` stages run a deterministic command and `role: human`
# stages are gates, so they ignore these hints. A stage with no hints runs
# exactly as it did before v3.0.0. The manifest `risk: high` level can raise
# effort on every model stage at orchestration time (see run.md Step 7).

pipeline: feature

stages:
  - name: manifest
    role: human
    artifact: manifest.yaml
    gate: human_approval

  # v1.2.0 hardening: priority-drift + manifest-integrity gates run
  # AFTER the human APPROVE on the manifest and BEFORE researcher
  # spends a model call.
  - name: preflight
    role: pipeline
    command: python scripts/policy/run_preflight.py --run {run_id}
    artifact: preflight-report.md
    speed: fast  # latency-sensitive; advisory for the command stage

  - name: research
    role: researcher
    artifact: research.md

  - name: plan
    role: planner
    artifact: plan.md
    gate: human_approval

  - name: test-write
    role: test-writer
    artifact: failing-tests-report.md

  - name: execute
    role: executor
    artifact: implementation-report.md

  - name: policy
    role: pipeline
    command: python scripts/policy/run_all.py --run {run_id}
    artifact: policy-report.md
    speed: fast  # latency-sensitive; advisory for the command stage

  - name: verify
    role: verifier
    artifact: verifier-report.md
    effort: max  # quality-critical: independent criterion verification

  - name: drift-detect
    role: drift-detector
    artifact: drift-report.md
    effort: max  # quality-critical: manifest-vs-result drift

  - name: critique
    role: critic
    artifact: critic-report.md
    effort: max  # quality-critical: hostile cold read

  - name: auto-promote
    role: pipeline
    command: python scripts/policy/auto_promote.py --run {run_id}
    artifact: auto-promote-report.md
    optional_artifact: true

  - name: manager
    role: manager
    artifact: manager-decision.md
    gate: human_approval
    effort: max  # quality-critical: final promote/block decision
    # v1.3.0: when auto_promote_aware: true AND auto_promote.py wrote
    # manager-decision.md with **Decision: PROMOTE** as its first line,
    # the run skill skips the human gate. Otherwise the gate fires
    # via AskUserQuestion (modal APPROVE / BLOCK / REPLAN).
    auto_promote_aware: true
